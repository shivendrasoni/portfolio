name: a9 assemble

on:
  push:
    branches: [blog/a9-irreversible-actions]
    paths: [.github/workflows/a9-assemble.yml]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/a9-irreversible-actions
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Unpack post
        run: |
          printf %s '' >> /tmp/a9.b64
          printf %s '' >> /tmp/a9.b64
          printf %s '' >> /tmp/a9.b64
          printf %s '' >> /tmp/a9.b64
          printf %s '' >> /tmp/a9.b64
          base64 -d /tmp/a9.b64 > /tmp/a9.xz
          xz -d -c /tmp/a9.xz > content/blog/agent-irreversible-actions.md
          echo "017eb1e51439965dbdc92eb9fdfa79aecc7cf757f5d03a532480ff96b7eacbed  content/blog/agent-irreversible-actions.md" > /tmp/a9.sha
          sha256sum -c /tmp/a9.sha
      - name: Render figures
        run: |
          npm ci
          npm run diagrams
      - name: Build check
        run: npm run build
      - name: Commit
        run: |
          rm -f .github/workflows/a9-assemble.yml
          rm -rf dist
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status --short
          git commit -m "blog: add A9, design an agent that is allowed to take an irreversible action" -m "The authoring machine has no git, so the markdown was staged as a compressed payload inside this workflow and unpacked on the runner, with its sha256 checked against the file that was written and tested locally. The two figures were rendered from the mermaid fences by scripts/render-diagrams.mjs on this runner. This workflow deletes itself in this same commit, so the diff against main is the post and its figures and nothing else."
          git push origin HEAD:blog/a9-irreversible-actions
