name: b11 retitle

on:
  push:
    branches: [blog/b11-rewrite-plain-register]
    paths: [.github/workflows/retitle.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/b11-rewrite-plain-register
      - name: Rename to the judge slug and add the redirect
        run: |
          printf %s  >> /tmp/ci.b64
          printf %s  >> /tmp/ci.b64
          printf %s  >> /tmp/ci.b64
          base64 -d /tmp/ci.b64 > /tmp/ci_retitle.py
          python3 /tmp/ci_retitle.py
          rm -f .github/workflows/retitle.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status --short
          git commit -m "blog: retitle to decision models as a judge, new slug, redirect the old slug"
          git push origin HEAD:blog/b11-rewrite-plain-register
