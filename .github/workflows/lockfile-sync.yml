# TEMPORARY. Delete before this branch merges.
#
# The blog pipeline adds three devDependencies, so package-lock.json has to
# change or `npm ci` fails with EUSAGE. The lockfile could not be pushed from
# the machine that built this branch, so it is regenerated here instead.
#
# Scoped to this one branch, runs nothing on main, and commits only
# package-lock.json.
name: Sync lockfile (temporary)

on:
  push:
    branches:
      - blog/pipeline-phase-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/pipeline-phase-1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Regenerate lockfile only
        run: npm install --package-lock-only

      - name: Commit if it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "lockfile already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate lockfile for blog build deps"
          git push
