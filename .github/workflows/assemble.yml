name: assemble judge post

on:
  push:
    branches: [blog/judge-decision-models]
    paths: ['.github/workflows/assemble.yml']

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/judge-decision-models
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Assemble the markdown from the staged parts
        run: |
          cat content/_staging/a.md content/_staging/b.md content/_staging/c.md > content/blog/decision-models-as-a-judge-for-a-semantic-cache.md
          md5sum content/blog/decision-models-as-a-judge-for-a-semantic-cache.md
          rm -rf content/_staging
      - name: Install
        run: npm ci
      - name: Render the figures
        run: npm run diagrams
      - name: Check the build
        run: npm run build
      - name: Remove this workflow
        run: rm -f .github/workflows/assemble.yml
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status --short
          git commit -m "blog: decision models as a judge for a semantic cache"
          git push origin HEAD:blog/judge-decision-models
