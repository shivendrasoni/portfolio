name: render b13 figures

on:
  push:
    branches: [blog/b13-canary-quality-failure]
    paths: [.github/workflows/b13render.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/b13-canary-quality-failure
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Render figures
        run: |
          node scripts/render-diagrams.mjs
          node scripts/render-diagrams.mjs --check
      - name: Remove this temporary workflow
        run: rm -f .github/workflows/b13render.yml
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status --short
          git commit -m "blog: render the two figures for the canary post"
          git push origin HEAD:blog/b13-canary-quality-failure
