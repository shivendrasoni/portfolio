name: render b12 figures

on:
  push:
    branches: [blog/b12-agent-memory-write-path]
    paths: [.github/workflows/b12render.yml]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/b12-agent-memory-write-path
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Render figures
        run: |
          node scripts/render-diagrams.mjs
          node scripts/render-diagrams.mjs --check
      - name: Drop figures no post references any more
        run: |
          rm -f content/blog/diagrams/21cfee5a7c76.svg content/blog/diagrams/21cfee5a7c76.png
          rm -f content/blog/diagrams/ce08f5b071a2.svg content/blog/diagrams/ce08f5b071a2.png
          rm -f .github/workflows/b12render.yml
      - name: Build
        run: npm run build
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status --short
          git commit -m "blog: render the two figures for the forgetting rewrite, drop the superseded pair"
          git push origin HEAD:blog/b12-agent-memory-write-path
