# TEMPORARY. Branch scoped, dispatch only, and deleted by its own commit.
# The machine that authored this branch has no git binary and its transport
# caps payload size, so the edit is staged as three byte ranges of one patch
# script, reassembled and applied here.
name: blog figure caption (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch, then delete the tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat tools/figcap.0 tools/figcap.1 tools/figcap.2 > /tmp/figcap.py
          sha256sum /tmp/figcap.py
          python3 /tmp/figcap.py
          rm tools/figcap.0 tools/figcap.1 tools/figcap.2
          rmdir tools || true
          rm .github/workflows/blog-figcaption.yml
          git add -A
          git commit -m 'blog: keep the figure caption attached to its image on import' -m 'The Medium importer pairs a caption to an image by walking the children of the figure. The wrapping div and picture meant it saw neither, so every figcaption was dropped on import and the figures arrived without the sentence that carries what the prose deliberately does not repeat.' -m 'The img and the figcaption are now direct children of the figure. The vector is kept for browsers through srcset, which a browser prefers and a document parser ignores, so a reader still gets the SVG and an importer still copies the PNG from src. No content file changes.'
          git push
