name: tmp assemble and render

on:
  push:
    branches:
      - blog/post-url-shortener-hot-key

jobs:
  render:
    if: contains(github.event.head_commit.message, 'Assemble post')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: assemble post from staged parts
        run: |
          cat content/blog/_a1p1.md content/blog/_a1p2.md > content/blog/url-shortener-hot-key.md
          rm content/blog/_a1p1.md content/blog/_a1p2.md
          rm .github/workflows/tmp-render-diagrams.yml
          wc -c content/blog/url-shortener-hot-key.md
      - run: npm ci
      - run: npm run diagrams
      - run: npm run lint
      - run: npm run build
      - name: commit assembled post and rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/blog .github/workflows
          git commit -m "Post: design a URL shortener that survives a hot key"
          git push
