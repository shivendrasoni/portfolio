name: tmp render diagrams

on:
  push:
    branches:
      - blog/post-url-shortener-hot-key

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run diagrams
      - name: commit rendered diagrams
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/blog/diagrams
          git diff --cached --quiet || git commit -m "Render diagrams for url-shortener-hot-key"
          git push
