# TEMPORARY. Branch scoped, manual only, deleted before this PR is reviewed.
#
# Exists because the machine that authored this branch has no git binary and
# cannot push generated binary-ish blobs through the API. This workflow applies
# the two bootstrap edits and renders the mermaid diagrams on a runner, then
# commits the result to this branch.
name: diagram bootstrap (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/blog/diagrams-phase-2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply bootstrap edits
        run: |
          python3 tools/diagram-bootstrap-1.py
          python3 tools/diagram-bootstrap-2.py

      - name: Render diagrams
        run: npm run diagrams

      - name: Show what changed
        run: git --no-pager status --short

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'blog: apply diagram edits and commit rendered SVG' || echo 'nothing to commit'
          git push
