# TEMPORARY. Branch scoped, deleted before this PR is reviewed.
#
# Exists because the machine that authored this branch has no git binary and
# cannot push generated blobs through the API. This workflow applies the two
# bootstrap edits and renders the mermaid diagrams on a runner, then commits the
# result to this branch. A push made with GITHUB_TOKEN does not trigger
# workflows, so this cannot retrigger itself.
name: diagram bootstrap (temporary)

on:
  push:
    branches:
      - blog/diagrams-phase-2

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply bootstrap edits
        run: |
          python3 tools/diagram-bootstrap-1.py
          python3 tools/diagram-bootstrap-2.py

      - name: Render diagrams
        run: npm run diagrams

      - name: Show what changed
        run: git --no-pager status --short

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'blog: apply diagram edits and commit rendered SVG' || echo 'nothing to commit'
          git push
