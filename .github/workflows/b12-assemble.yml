name: b12 assemble

on:
  push:
    branches: [blog/b12-agent-memory-write-path]
    paths: [.github/workflows/b12-assemble.yml]

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/b12-agent-memory-write-path
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Render figures from the mermaid fences
        run: |
          npm ci
          npm run diagrams
      - name: Build check
        run: npm run build
      - name: Commit figures and remove this workflow
        run: |
          rm -f .github/workflows/b12-assemble.yml
          rm -rf dist
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status --short
          git commit -m "blog: render B12 figures" -m "Figures rendered from the mermaid fences by scripts/render-diagrams.mjs on this runner, because the authoring machine has no git. This workflow deletes itself in this same commit, so the diff against main is the post and its two figures and nothing else."
          git push origin HEAD:blog/b12-agent-memory-write-path
