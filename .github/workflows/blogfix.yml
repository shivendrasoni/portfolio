name: blog fix

on:
  push:
    branches: [blog/batch-six-posts]
    paths: [.github/workflows/blogfix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: blog/batch-six-posts
      - name: Apply blog edits
        run: |
          printf %s  >> /tmp/p.b64
          printf %s  >> /tmp/p.b64
          printf %s YGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBg8HD4G/TBztcAUAAA >> /tmp/p.b64
          base64 -d /tmp/p.b64 > /tmp/p.tgz
          tar xzf /tmp/p.tgz
          python3 patch_blog.py
          mv msg.txt /tmp/msg.txt
          rm -f patch_blog.py .github/workflows/blogfix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git status --short
          git commit -F /tmp/msg.txt
          git push origin HEAD:blog/batch-six-posts
