# TEMPORARY. Branch scoped, and deleted by its own final commit.
#
# The machine that authored this branch has no git binary, so rendered SVG
# cannot be pushed through the API, and the transport it does have escapes
# quotes, so post markdown is staged quote free under content/blog/_enc and
# decoded here. Everything is already staged, so this runs once, on the push
# that adds this trigger. A push made with GITHUB_TOKEN does not trigger
# workflows, so it cannot retrigger itself, and it deletes itself at the end.
name: blog batch assemble (temporary)

on:
  push:
    branches:
      - blog/batch-six-posts

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      SLUGS: 'rag-when-retrieval-is-wrong feed-fanout-write-versus-read consistent-hashing-what-the-diagram-hides needle-in-a-haystack-long-context bloom-filters-who-pays-for-the-false-positive guardrails-false-positives-user-register'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply the pipeline edits and commit them on their own
        run: |
          python3 tools/blog-batch-1.py
          python3 tools/blog-batch-2.py
          git add plugins/blog/diagrams.ts plugins/blog/markdown.ts src/components/blog/prose.css
          git commit -m 'blog: render hand authored SVG figures, and let figures use the full width on wide screens'

      - name: Decode the staged posts
        run: |
          for slug in $SLUGS; do python3 tools/blog-batch-decode.py $slug; done

      - name: Render every diagram
        run: npm run diagrams

      - name: Commit one post at a time, each with its own figures
        run: |
          for slug in $SLUGS; do
            figs=$(node tools/blog-batch-figs.mjs $slug)
            git add content/blog/$slug.md $figs
            git commit -m 'blog: '$slug
          done

      - name: Verify every diagram is present and current
        run: npm run diagrams:check

      - name: Remove the temporary tooling and push
        run: |
          git rm -r --quiet tools content/blog/_enc .github/workflows/blog-batch.yml
          git add -A
          git commit -m 'chore: remove the temporary batch assembly tooling'
          git --no-pager log --oneline -12
          git push
